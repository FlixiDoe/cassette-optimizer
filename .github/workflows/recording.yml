name: Recording tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recording:
    name: Node and offline Chromium recording
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run test:recording
